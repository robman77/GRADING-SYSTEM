<section id="power">
<div>
    <form id="formm"> 
        <header class="mb-3">
    <marquee behavior="" direction="right">Welcome to the official Grading System Page</marquee>
</header>
        <h2>GRADING SYSTEM</h2>
        <h1 class="h3 mb-3 fw-normal">Please sign in</h1>
         <div class="form-floating" style="display: flex;"> 
            <input style="height: 50px;" type="text/number" class="form-control" id="userScore" placeholder="Enter your score"> 
            <label for="floatingInput">Enter Your Score</label> 
                 <button type="button" style="background-color:green; border: none;border-radius: 5px;" onclick="checkResult()">Check</button> 

        </div> 
        <div>
            <input type="text" class="form-control w-50 mx-auto" disabled="" placeholder="See Result Here" aria-label="Your Result" aria-describedby="button-addon2" id="R">
        </div>
<br>
        <p style="color: white;text-align: center;" ><small>© Robman77</small></p> 
        </div>
</form>
</div>
</div>
</section>
    </div>

   VANTA.NET({
